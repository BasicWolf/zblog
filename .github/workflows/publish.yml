name: Build and Deploy the blog

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

env:
  DEBUG: 1
  ACCESS_TOKEN_BASICWOLF_GITHUB_IO: ${{ secrets.ACCESS_TOKEN_BASICWOLF_GITHUB_IO }}

jobs:
  build:
    runs-on: ubuntu-latest
    # if: |
    #   github.event_name == 'workflow_dispatch' ||
    #   contains(github.event.head_commit.message, 'ci:publish')
    defaults:
      run:
        shell: bash
        working-directory: src
    steps:
      - uses: actions/checkout@v3

      - name: "Setup Python"
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: "Install Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml
          make install

      - name: "Publish the blog"
        permissions:
          contents: write
        run: make publish-from-ci
